services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://raglab:change-me@postgres:5432/raglab}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://object-store:9000}
      S3_BUCKET: ${S3_BUCKET:-raglab-artifacts}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-raglab}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-this-s3-password}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-RAGLab}
      RAGLAB_PRICING_JSON: ${RAGLAB_PRICING_JSON:-}
      RAGLAB_PRICING_VERSION: ${RAGLAB_PRICING_VERSION:-unconfigured}
      RAGLAB_PRICING_UPDATED_AT: ${RAGLAB_PRICING_UPDATED_AT:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      object-store: {condition: service_healthy}
  worker:
    build: ./backend
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://raglab:change-me@postgres:5432/raglab}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://object-store:9000}
      S3_BUCKET: ${S3_BUCKET:-raglab-artifacts}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-raglab}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-this-s3-password}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-RAGLab}
      RAGLAB_PRICING_JSON: ${RAGLAB_PRICING_JSON:-}
      RAGLAB_PRICING_VERSION: ${RAGLAB_PRICING_VERSION:-unconfigured}
      RAGLAB_PRICING_UPDATED_AT: ${RAGLAB_PRICING_UPDATED_AT:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      object-store: {condition: service_healthy}
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raglab}
      POSTGRES_USER: ${POSTGRES_USER:-raglab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raglab} -d ${POSTGRES_DB:-raglab}"]
      interval: 5s
      timeout: 4s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  object-store-init:
    image: alpine:3.21
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes: ["minio_data:/data"]
    restart: "no"
  object-store:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-raglab}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-change-this-s3-password}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    depends_on:
      object-store-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]
    volumes: ["phoenix_data:/root/.phoenix"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
  phoenix_data:
  mlflow_data:
